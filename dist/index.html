<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dfff78">
  <meta name="description" content="Quelques questions, un peu de second degré et une façon plus simple de faire connaissance.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="On se capte ?">
  <title>On se capte ? — Le petit jeu pour faire connaissance</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="On se capte ? Accueil">on se capte<span>?</span></a>
      <span class="edition">LE PETIT JEU DES VRAIES GENS</span>
      <button class="icon-button" id="info-button" aria-label="À propos des réponses">?</button>
    </header>
    <main id="main">
      <div class="game-meta"><span id="chapter">ON BRISE LA GLACE</span><span id="counter">À TON RYTHME</span></div>
      <div class="progress" role="progressbar" aria-label="Progression du questionnaire" aria-valuemin="0" aria-valuemax="12" aria-valuenow="0"><div id="progress-fill"></div></div>
      <div id="demo-banner" class="demo-banner" hidden>Aperçu du jeu · les réponses ne sont pas enregistrées.</div>
      <section id="card" class="card" aria-labelledby="question-title"></section>
      <div id="controls" class="controls"></div>
      <p class="footnote" id="footnote">Zéro bonne réponse. Juste les tiennes.</p>
      <div class="chapter-track" aria-hidden="true"><span class="active">01 · Le sourire</span><span>02 · Le quotidien</span><span>03 · L’essentiel</span></div>
    </main>
    <footer><span>Moins de « ça va ? », plus de toi.</span><span>✳</span></footer>
  </div>
  <dialog id="info-dialog" aria-labelledby="info-title">
    <div class="dialog-top"><span class="eyebrow">ENTRE NOUS</span><button id="close-info" class="icon-button" aria-label="Fermer">×</button></div>
    <h2 id="info-title">Tes réponses, tu choisis.</h2>
    <div id="privacy-copy"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Active JavaScript pour répondre au questionnaire.</noscript>
</body>
</html>
